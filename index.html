 i po drugiej stronie. Ich Pan prowadził je i stanął między nimi a wilkami.[[14]]"},{"t":"v","v":"25","text":"Ponieważ wilki nie widziały jeszcze owiec, weszły w sam środek morza. Ruszyły za owcami i pobiegły za nimi w to morze."},{"t":"v","v":"26","text":"A gdy zobaczyły Pana owiec, zawróciły, aby uciec sprzed Jego oblicza. Lecz wtedy morze zebrało się z powrotem i stało się takie, jakie zostało stworzone. Woda wezbrała i podniosła się, aż zakryła wilki."},{"t":"v","v":"27","text":"I patrzyłem, aż wszystkie wilki, które ścigały owce, zginęły i potonęły."},{"t":"v","v":"28","text":"Owce zaś wyszły z tej wody na pustynię, gdzie nie było ani wody, ani trawy. I zaczęły otwierać oczy i widzieć.[[15]] Zobaczyłem, jak Pan owiec je pasie, daje im wodę i trawę i jak tamta owca idzie i je prowadzi."},{"t":"v","v":"29","text":"Owca ta weszła na szczyt wysokiej skały, a Pan owiec posłał ją [z powrotem] do nich.[[16]]"},{"t":"v","v":"30","text":"Potem zobaczyłem Pana owiec, jak stanął przed nimi. Jego postać była wielka, groźna i pełna majestatu, a wszystkie owce widziały Go i bały się Jego oblicza."},{"t":"v","v":"31","text":"Wszystkie lękały się Go i drżały przed Nim. I wołały do owcy, która była z nimi [pośrodku nich]: „Nie możemy ustać przed naszym Panem ani na Niego patrzeć”.[[17]]"},{"t":"v","v":"32","text":"Owca, która je prowadziła, znowu weszła na szczyt tej skały. A owce zaczęły ślepnąć i schodzić z drogi, którą im pokazała, lecz owca ta o tym nie wiedziała.[[18]]"},{"t":"v","v":"33","text":"Wtedy Pan owiec zapłonął wielkim gniewem przeciwko nim. Owca ta dowiedziała się o tym, zeszła ze szczytu skały, przyszła do owiec i zastała większość z nich zaślepioną i odpadłą od Jego drogi."},{"t":"v","v":"34","text":"Gdy ją zobaczyły, przestraszyły się, zadrżały przed nią i chciały wrócić do swoich zagród."},{"t":"v","v":"35","text":"Owca ta wzięła ze sobą inne owce, przyszła do tych, które odpadły, i zaczęła je zabijać. Owce bały się jej. I tak owca ta zawróciła te owce, które odpadły, a one wróciły do swoich zagród.[[19]]"},{"t":"v","v":"36","text":"I patrzyłem w tym widzeniu, aż owca ta stała się człowiekiem, zbudowała dom dla Pana owiec i umieściła wszystkie owce w tym domu.[[20]]"},{"t":"v","v":"37","text":"I patrzyłem, aż zasnęła ta owca, która [kiedyś] wyszła na spotkanie owcy prowadzącej stado.[[21]] Patrzyłem też, aż wyginęły wszystkie duże owce, a na ich miejsce wyrosły młode. Doszły one do pastwiska i zbliżyły się do strumienia wody."},{"t":"v","v":"38","text":"Wtedy owca, która je prowadziła - ta, która stała się człowiekiem - odłączyła się od nich i zasnęła.[[22]] Wszystkie owce jej szukały i podniosły nad nią wielki płacz."},{"t":"v","v":"39","text":"I zobaczyłem, że przestały płakać po tej owcy i przeszły przez ten strumień wody. I powstały dwie owce jako przewodnicy w miejsce tych, które [je prowadziły i] zasnęły.[[23]]"},{"t":"v","v":"40","text":"I patrzyłem, aż owce doszły do dobrego miejsca, do ziemi rozkosznej i wspaniałej. Widziałem, jak się nasyciły, a ich dom stał pośród nich w tej rozkosznej ziemi.[[24]]"},{"t":"v","v":"41","text":"Czasem ich oczy się otwierały, a czasem ślepły - aż powstała inna owca, poprowadziła je i sprowadziła wszystkie z powrotem, a ich oczy się otworzyły.[[25]]"},{"t":"v","v":"42","text":"A psy, lisy i dziki zaczęły pożerać owce, aż Pan owiec wzbudził spośród nich barana, który je poprowadził.[[26]]"},{"t":"v","v":"43","text":"Baran ten zaczął bóść na obie strony te psy, lisy i dziki, aż wytracił je wszystkie."},{"t":"v","v":"44","text":"A owca, której oczy były otwarte, patrzyła na tego barana pośród owiec - aż wyrzekł się on swojej chwały i zaczął bóść owce, deptał je i postępował niegodnie.[[27]]"},{"t":"v","v":"45","text":"Wtedy Pan owiec posłał baranka do innego baranka, aby go wynieść na barana i przewodnika owiec w miejsce barana, który wyrzekł się swojej chwały.[[28]]"},{"t":"v","v":"46","text":"Poszedł do niego, rozmawiał z nim sam na sam, wyniósł go na barana i uczynił go księciem i przewodnikiem owiec. A przez cały ten czas psy uciskały owce."},{"t":"v","v":"47","text":"Pierwszy baran ścigał tego drugiego barana, a ten drugi baran wstał i uciekł przed nim. I patrzyłem, aż psy powaliły pierwszego barana.[[29]]"},{"t":"v","v":"48","text":"A ten drugi baran wstał i poprowadził owce."},{"t":"v","v":"49","text":"Owce te rosły i mnożyły się, a wszystkie psy, lisy i dziki bały się go i uciekały przed nim, bo baran ten bódł i pozabijał dzikie zwierzęta, tak że nie miały już one żadnej władzy wśród owiec i niczego już im nie porywały."},{"t":"v","v":"48b","text":"Baran ten zrodził wiele owiec i zasnął. A mały baranek stał się baranem na jego miejsce i został księciem i przewodnikiem tych owiec.[[30]]"},{"t":"v","v":"50","text":"A ich dom stał się wielki i przestronny i został zbudowany dla owiec. Na domu wzniesiono dla Pana owiec wieżę - wyniosłą i wielką. Dom był niski, lecz wieża wznosiła się wysoko. Pan owiec stanął na tej wieży, a przed Nim zastawiono pełny stół.[[31]]"},{"t":"v","v":"51","text":"I znowu zobaczyłem te owce: jak ponownie błądziły, chodziły wieloma drogami i porzuciły swój dom. A Pan owiec wzywał niektóre spośród owiec i posyłał je do owiec, lecz owce zaczęły je zabijać.[[32]]"},{"t":"v","v":"52","text":"Jedna z nich jednak ocalała i nie została zabita. Umknęła i wołała [świadcząc] przeciwko owcom, a one chciały ją zabić. Lecz Pan owiec wybawił ją z rąk owiec, wyniósł ją do mnie i tam kazał jej zamieszkać.[[33]]"},{"t":"v","v":"53","text":"I wiele innych owiec posyłał do tych owiec, aby dawały świadectwo i zawodziły nad nimi."},{"t":"v","v":"54","text":"Potem zobaczyłem, że gdy porzuciły dom Pana i Jego wieżę, odpadły całkowicie, a ich oczy oślepły. I zobaczyłem, jak Pan owiec dokonywał wielkiej rzezi wśród nich, w ich stadach, aż owce [same] tę rzeź ściągnęły na siebie i zdradziły Jego miejsce.[[34]]"},{"t":"v","v":"55","text":"Wtedy wydał je w ręce lwów i tygrysów, wilków i hien, w ręce lisów i wszystkich zwierząt. I te dzikie zwierzęta zaczęły rozszarpywać owce.[[35]]"},{"t":"v","v":"56","text":"I zobaczyłem, że opuścił ich dom i ich wieżę i wydał je wszystkie w ręce lwów - w ręce wszystkich zwierząt - aby je rozszarpywały i pożerały."},{"t":"v","v":"57","text":"Zacząłem wołać ze wszystkich sił i wzywać Pana owiec, i przedstawiać Mu, że owce są pożerane przez wszystkie dzikie zwierzęta."},{"t":"v","v":"58","text":"Lecz On pozostał niewzruszony, choć to widział. Cieszył się, że są pożerane, połykane i grabione, i zostawił je na pożarcie w rękach wszystkich zwierząt.[[36]]"},{"t":"v","v":"59","text":"I wezwał siedemdziesięciu pasterzy, i porzucił owce, oddając je im, aby je paśli. Powiedział do pasterzy i ich towarzyszy: „Od tej chwili każdy z was ma paść owce. Czyńcie wszystko, co wam rozkażę.[[37]]"},{"t":"v","v":"60","text":"Przekażę wam je dokładnie policzone i wskażę wam, które mają zostać zabite - i te zabijcie”. I przekazał im owce."},{"t":"v","v":"61","text":"Potem zawołał innego[[38]] i powiedział mu: „Uważaj i patrz na wszystko, co pasterze będą robić z tymi owcami, bo wytracą ich więcej, niż im rozkazałem."},{"t":"v","v":"62","text":"Zapisz każdy nadmiar i każdą zagładę, których dopuszczą się pasterze: ile owiec zginie z mojego rozkazu, a ile z ich własnej samowoli. Zapisz przeciwko każdemu pasterzowi z osobna wszystko, co zniszczy."},{"t":"v","v":"63","text":"Potem odczytaj przede mną według liczby, ile zabili i ile wydali na zagładę z własnej woli, abym miał to jako świadectwo przeciwko nim; abym znał każdy czyn pasterzy i mógł ich ocenić, i zobaczyć, co robią - czy trzymają się rozkazu, który im dałem, czy nie."},{"t":"v","v":"64","text":"Oni jednak nie mogą o tym wiedzieć. Nie mów im tego ani ich nie upominaj. Zapisuj tylko przeciwko każdemu z osobna całą zagładę, jakiej pasterze dokonują, każdy w swoim czasie, i wszystko przedkładaj mi”."},{"t":"v","v":"65","text":"I patrzyłem, jak ci pasterze paśli, każdy w swojej porze. I zaczęli zabijać i niszczyć więcej, niż im polecono, i wydali owce w ręce lwów."},{"t":"v","v":"66","text":"Lwy i tygrysy pożarły większą część owiec, a razem z nimi żerowały dziki. I spaliły wieżę, i zburzyły dom.[[39]]"},{"t":"v","v":"67","text":"I bardzo się zasmuciłem z powodu wieży, bo dom owiec został zburzony. Potem nie mogłem już zobaczyć, czy owce weszły do tego domu."},{"t":"v","v":"68","text":"Pasterze zaś i ich towarzysze wydawali owce na pożarcie wszystkim dzikim zwierzętom. Każdy z nich w swoim czasie otrzymywał określoną liczbę, a tamten [drugi] zapisywał w księdze, ile każdy z nich wytracił."},{"t":"v","v":"69","text":"I każdy zabijał i niszczył o wiele więcej, niż mu wyznaczono. Wtedy zacząłem płakać i zawodzić z powodu tych owiec."},{"t":"v","v":"70","text":"I tak w widzeniu patrzyłem na tego, który pisał: jak dzień po dniu zapisywał każdą owcę zgładzoną przez pasterzy i jak zanosił, przedkładał i pokazywał Panu owiec całą księgę - wszystko, co uczynili, wszystko, co każdy z nich zabrał, i wszystko, co wydali na zagładę."},{"t":"v","v":"71","text":"Księgę odczytano przed Panem owiec. On wziął ją z jego ręki, przeczytał, opieczętował i odłożył."},{"t":"v","v":"72","text":"Potem zobaczyłem, jak pasterze paśli przez dwanaście godzin.[[40]] A trzy z tych owiec zawróciły, przyszły, weszły i zaczęły odbudowywać wszystko, co się z tego domu zawaliło. Dziki próbowały im przeszkadzać, ale nie dały rady."},{"t":"v","v":"73","text":"I znowu zaczęły budować jak przedtem. Wzniosły tę wieżę i nazwano ją wieżą wysoką. I znowu zaczęły stawiać przed wieżą stół, ale cały chleb na nim był splamiony i nieczysty.[[41]]"},{"t":"v","v":"74","text":"A przy tym wszystkim oczy owiec były zaślepione, tak że nie widziały; tak samo [oczy] ich pasterzy. I wydawano je pasterzom na zagładę w wielkiej liczbie, a ci deptali owce nogami i pożerali je."},{"t":"v","v":"75","text":"Pan owiec pozostał jednak niewzruszony, aż wszystkie owce rozproszyły się po polu i wymieszały z [dzikimi] zwierzętami, a pasterze nie wyrywali ich z rąk zwierząt.[[42]]"},{"t":"v","v":"76","text":"A ten, który pisał księgę, zaniósł ją, pokazał i odczytał przed Panem owiec. Wstawiał się za nimi i błagał Go za nich, ukazując wszystkie czyny pasterzy i świadcząc przed Nim przeciwko wszystkim pasterzom."},{"t":"v","v":"77","text":"Potem wziął księgę, złożył ją przy Nim i odszedł."}],"notes":{"1":"18","2":"19","3":"20","4":"21","5":"22","6":"23","7":"24","8":"25","9":"26","10":"27","11":"28","12":"29","13":"30","14":"31","15":"32","16":"33","17":"34","18":"35","19":"36","20":"37","21":"38","22":"39","23":"40","24":"41","25":"42","26":"43","27":"44","28":"45","29":"46","30":"47","31":"48","32":"49","33":"50","34":"51","35":"52","36":"53","37":"54","38":"55","39":"56","40":"57","41":"58","42":"59"}},{"num":90,"part":"Księga snów","blocks":[{"t":"v","v":"1","text":"I patrzyłem, aż w ten sposób podjęło wypas trzydziestu pięciu pasterzy.[[1]] Wszyscy, każdy w swoim czasie, wypełnili swoje okresy tak jak pierwsi, a inni przejmowali owce w swoje ręce, aby je paść - każdy pasterz w swoim własnym okresie."},{"t":"v","v":"2","text":"Potem zobaczyłem w widzeniu, jak nadleciały wszystkie ptaki nieba: orły, sępy, kanie i kruki, a orły przewodziły wszystkim ptakom.[[2]] I zaczęły pożerać owce: wydziobywać im oczy i pożerać ich ciało."},{"t":"v","v":"3","text":"Owce krzyczały, bo ptaki pożerały ich ciało. Ja także patrzyłem i zawodziłem w moim śnie nad tym pasterzem, który pasł owce."},{"t":"v","v":"4","text":"I patrzyłem, aż owce zostały pożarte przez psy, orły i kanie. Nie zostawiły na nich ani ciała, ani skóry, ani ścięgna - aż zostały tylko same ich kości. A kości padły na ziemię i owiec było coraz mniej."},{"t":"v","v":"5","text":"I patrzyłem, aż wypas podjęło dwudziestu trzech [pasterzy]. Wypełnili oni, każdy w swoim czasie, pięćdziesiąt osiem okresów.[[3]]"},{"t":"v","v":"6","text":"A z białych owiec narodziły się jagnięta. Zaczęły otwierać oczy, widzieć i wołać do owiec.[[4]]"},{"t":"v","v":"7","text":"Wołały do nich, lecz tamte ich nie słuchały. Były bowiem całkiem głuche, a ich oczy - bardzo mocno zaślepione."},{"t":"v","v":"8","text":"I zobaczyłem w widzeniu, jak kruki spadły na te jagnięta. Porwały jedno z nich[[5]], a owce rozszarpały na kawałki i pożarły."},{"t":"v","v":"9","text":"I patrzyłem, aż jagniętom wyrosły rogi, lecz kruki strącały ich rogi. I patrzyłem, aż na jednej z tych owiec wyrósł wielki róg[[6]], a ich oczy się otworzyły."},{"t":"v","v":"10","text":"[Baran z wielkim rogiem] spoglądał na nie i ich oczy się otwierały. Wołał do owiec, a barany go zobaczyły i wszystkie zbiegły się do niego."},{"t":"v","v":"11","text":"Mimo to wszystko orły, sępy, kruki i kanie nadal rozszarpywały owce, spadały na nie i je pożerały. Owce milczały, ale barany zawodziły i krzyczały."},{"t":"v","v":"12","text":"A kruki walczyły i toczyły z nim bój. Chciały strącić jego róg, ale nic nie mogły mu zrobić."},{"t":"v","v":"13","text":"I patrzyłem, aż przyszli pasterze, orły, sępy i kanie. Krzyczeli na kruki, aby zmiażdżyły róg tego barana. Walczyły z nim i toczyły bój, a on walczył z nimi i wołał, aby nadeszła jego pomoc.[[7]]"},{"t":"v","v":"14","text":"I patrzyłem, aż przyszedł ten człowiek, który spisywał imiona pasterzy i zanosił [księgę] przed Pana owiec. On pomógł temu baranowi i wybawił go, i ukazał mu wszystko: zstąpił baranowi na pomoc.[[8]]"},{"t":"v","v":"15","text":"I patrzyłem, aż Pan owiec przyszedł do nich w gniewie, a wszyscy, którzy Go zobaczyli, rzucili się do ucieczki i padli w mrok przed Jego obliczem."},{"t":"v","v":"16","text":"Wszystkie orły, sępy, kruki i kanie zgromadziły się razem, a z nimi przyszły wszystkie owce polne.[[9]] Zebrały się razem i pomagały sobie nawzajem, aby zmiażdżyć róg tego barana."},{"t":"v","v":"17","text":"I patrzyłem na tego człowieka, który pisał księgę na rozkaz Pana, aż otworzył księgę zagłady, jakiej dokonało ostatnich dwunastu pasterzy, i wykazał przed Panem owiec, że wytracili o wiele więcej niż ich poprzednicy."},{"t":"v","v":"18","text":"I patrzyłem, aż Pan owiec przyszedł do nich, wziął w rękę laskę gniewu i uderzył nią w ziemię. Ziemia się rozstąpiła, a wszystkie zwierzęta i wszystkie ptaki nieba odpadły od owiec i zapadły się w ziemię, która się nad nimi zamknęła."},{"t":"v","v":"19","text":"I patrzyłem, aż owcom został dany wielki miecz. Owce wyruszyły przeciwko wszystkim dzikim zwierzętom, aby je pozabijać, a wszystkie zwierzęta i ptaki nieba uciekały przed nimi.[[10]]"},{"t":"v","v":"20","text":"I patrzyłem, aż na rozkosznej ziemi ustawiono tron i zasiadł na nim Pan owiec. A tamten [drugi] wziął wszystkie zapieczętowane księgi i otworzył je przed Panem owiec.[[11]]"},{"t":"v","v":"21","text":"I Pan zawołał tych ludzi - siedmiu pierwszych białych - i rozkazał, aby przyprowadzili przed Niego, poczynając od pierwszej gwiazdy, która szła na czele, wszystkie gwiazdy, których członki były jak członki koni. I przyprowadzili je wszystkie przed Niego.[[12]]"},{"t":"v","v":"22","text":"I powiedział do tego człowieka, który pisał przed Nim - a był on jednym z tych siedmiu białych: „Weź tych siedemdziesięciu pasterzy, którym przekazałem owce i którzy z własnej samowoli zabili ich więcej, niż im rozkazałem”."},{"t":"v","v":"23","text":"I zobaczyłem: wszyscy byli związani i wszyscy stanęli przed Nim."},{"t":"v","v":"24","text":"Najpierw odbył się sąd nad gwiazdami. Osądzono je i uznano winnymi, i poszły na miejsce potępienia: wrzucono je w otchłań pełną ognia, płonącą i pełną słupów ognia."},{"t":"v","v":"25","text":"Potem osądzono siedemdziesięciu pasterzy. Uznano ich winnymi i również wrzucono do tej ognistej otchłani."},{"t":"v","v":"26","text":"W tym czasie zobaczyłem też, jak pośrodku ziemi otwarto podobną otchłań, pełną ognia. Przyprowadzono zaślepione owce. Wszystkie zostały osądzone, uznane winnymi i wrzucone do tej ognistej otchłani, i płonęły. A otchłań ta była na prawo od domu.[[13]]"},{"t":"v","v":"27","text":"I widziałem, jak te owce płonęły - nawet ich kości się paliły."},{"t":"v","v":"28","text":"I wstałem, aby patrzeć, aż zwinięto ten stary dom. Wyniesiono wszystkie kolumny, a wszystkie belki i ozdoby domu zwinięto razem z nim. Wyniesiono go i złożono w pewnym miejscu na południu kraju.[[14]]"},{"t":"v","v":"29","text":"I patrzyłem, aż Pan owiec przyniósł nowy dom, większy i wyższy od pierwszego, i postawił go na miejscu tamtego, który zwinięto. Wszystkie jego kolumny były nowe, ozdoby nowe i większe niż w pierwszym, starym [domu], który usunięto. I wszystkie owce były w jego wnętrzu.[[15]]"},{"t":"v","v":"30","text":"I zobaczyłem wszystkie owce, które pozostały, oraz wszystkie zwierzęta na ziemi i wszystkie ptaki nieba: jak padają na twarz, oddają hołd owcom, błagają je i słuchają ich w każdym słowie.[[16]]"},{"t":"v","v":"31","text":"Potem ci trzej ubrani na biało - którzy już przedtem wynieśli mnie w górę - chwycili mnie za rękę, a także ręka tamtego barana mnie uchwyciła. Unieśli mnie i postawili pośród owiec, zanim rozpoczął się sąd.[[17]]"},{"t":"v","v":"32","text":"A owce te były całe białe, ich wełna zaś obfita i czysta."},{"t":"v","v":"33","text":"I wszyscy, którzy zginęli i którzy się rozproszyli, oraz wszystkie zwierzęta polne i wszystkie ptaki nieba zebrali się w tym domu.[[18]] A Pan owiec radował się wielką radością, bo wszyscy stali się dobrzy i wrócili do Jego domu."},{"t":"v","v":"34","text":"I patrzyłem, aż złożono miecz, który dano owcom. Wniesiono go z powrotem do domu i opieczętowano przed obliczem Pana.[[19]] Wszystkie owce zaproszono do tego domu, ale nie mógł ich pomieścić."},{"t":"v","v":"35","text":"Oczy wszystkich się otworzyły. Widzieli dobro i nie było wśród nich ani jednego, który by nie widział."},{"t":"v","v":"36","text":"I zobaczyłem, że dom ten był wielki, przestronny i wypełniony po brzegi."},{"t":"v","v":"37","text":"I zobaczyłem, że narodził się biały byk o wielkich rogach.[[20]] Wszystkie zwierzęta polne i wszystkie ptaki nieba bały się go i nieustannie zanosiły do niego prośby."},{"t":"v","v":"38","text":"I patrzyłem, aż wszystkie ich rody się przemieniły i wszystkie stały się białymi bykami. Pierwszy pośród nich stał się barankiem[[21]], a baranek ten stał się wielkim zwierzęciem z wielkimi, czarnymi rogami na głowie. A Pan owiec radował się nim i wszystkimi bykami."},{"t":"v","v":"39","text":"I zasnąłem pośród nich. Potem obudziłem się i widziałem wszystko."},{"t":"v","v":"40","text":"Takie jest widzenie, które zobaczyłem, gdy spałem. Obudziłem się i błogosławiłem Pana sprawiedliwości, i oddałem Mu chwałę."},{"t":"v","v":"41","text":"Potem jednak zapłakałem wielkim płaczem i moje łzy nie ustawały, aż nie mogłem już tego znieść. Gdy patrzyłem, płynęły z powodu wszystkiego, co zobaczyłem - bo wszystko to nadejdzie i się wypełni. Zostały mi przecież ukazane wszystkie czyny ludzi, po kolei."},{"t":"v","v":"42","text":"Tej nocy przypomniałem sobie mój pierwszy sen. Płakałem z jego powodu i byłem wstrząśnięty - dlatego, że zobaczyłem to widzenie."}],"notes":{"1":"60","2":"61","3":"62","4":"63","5":"64","6":"65","7":"66","8":"67","9":"68","10":"69","11":"70","12":"71","13":"72","14":"73","15":"74","16":"75","17":"76","18":"77","19":"78","20":"79","21":"80"}},{"num":91,"part":"Mowy Henocha do Matuzalema i jego rodziny","blocks":[{"t":"v","v":"1","text":"A teraz, mój synu Matuzalemie, zwołaj do mnie wszystkich swoich braci i zgromadź przy mnie wszystkich synów twojej matki. Wzywa mnie bowiem słowo i duch został na mnie wylany, abym pokazał wam wszystko, co was spotka - aż po wieczność."},{"t":"v","v":"2","text":"Wtedy Matuzalem poszedł, zwołał do niego wszystkich swoich braci i zebrał swoich krewnych."},{"t":"v","v":"3","text":"A [Henoch] przemówił do wszystkich dzieci sprawiedliwości: Słuchajcie, synowie Henocha, wszystkich słów waszego ojca i uważnie wsłuchajcie się w głos moich ust. Napominam was bowiem i mówię wam, umiłowani:"},{"t":"v","v":"4","text":"Kochajcie prawość i według niej postępujcie. Nie zbliżajcie się do prawości z podzielonym sercem i nie wiążcie się z ludźmi o podzielonym sercu. Postępujcie sprawiedliwie, moi synowie, a sprawiedliwość poprowadzi was dobrymi drogami i będzie waszą towarzyszką."},{"t":"v","v":"5","text":"Wiem bowiem, że przemoc na ziemi musi się wzmagać i że na ziemi dokona się wielka kara: wszelka nieprawość zostanie odcięta od korzeni, a cała jej budowla runie."},{"t":"v","v":"6","text":"Nieprawość znów dopełni się na ziemi: wszystkie dzieła nieprawości, przemocy i występku wezmą górę w dwójnasób."},{"t":"v","v":"7","text":"A gdy wzmogą się grzech, nieprawość, bluźnierstwo i przemoc we wszelkich czynach, gdy urosną odstępstwo, występek i nieczystość - wtedy na nich wszystkich spadnie z nieba wielka kara i święty Pan wystąpi z gniewem i karą, aby dokonać sądu na ziemi."},{"t":"v","v":"8","text":"W tych dniach przemoc zostanie wycięta z korzeniami, a korzenie nieprawości razem z oszustwem zostaną zniszczone spod nieba."},{"t":"v","v":"9","text":"Wszystkie bożki pogan zostaną porzucone, ich świątynie spalone ogniem i usunięte z całej ziemi. Sami [poganie] zostaną rzuceni na sąd ognia i zginą w gniewie, w surowym sądzie, na wieki."},{"t":"v","v":"10","text":"A sprawiedliwi zbudzą się ze snu; powstanie też mądrość i zostanie im dana.[[1]]"},{"t":"note","text":"Wersety 11–17 tego rozdziału przekład umieszcza przy Apokalipsie tygodni — zobacz rozdział 93."},{"t":"v","v":"18","text":"A teraz mówię wam, moi synowie, i pokazuję wam ścieżki sprawiedliwości i ścieżki przemocy. Pokażę wam je raz jeszcze, abyście wiedzieli, co nadchodzi."},{"t":"v","v":"19","text":"Teraz więc słuchajcie mnie, moi synowie: chodźcie ścieżkami sprawiedliwości, a ścieżkami przemocy nie chodźcie. Bo wszyscy, którzy chodzą ścieżkami nieprawości, zginą na zawsze."}],"notes":{"1":"1"}},{"num":92,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Księga napisana przez Henocha - [sam Henoch spisał tę całą naukę mądrości, chwaloną przez wszystkich ludzi i sądzącą całą ziemię] - dla wszystkich moich dzieci, które zamieszkają na ziemi, i dla przyszłych pokoleń, które będą strzec prawości i pokoju.[[1]]"},{"t":"v","v":"2","text":"Niech wasz duch nie trapi się z powodu czasów, bo Święty i Wielki wyznaczył dni dla wszystkich rzeczy."},{"t":"v","v":"3","text":"Sprawiedliwy powstanie ze snu, powstanie i pójdzie ścieżkami sprawiedliwości, a cała jego droga i całe postępowanie będą w wiecznej dobroci i łasce.[[2]]"},{"t":"v","v":"4","text":"[Bóg] okaże sprawiedliwemu łaskę i da mu wieczną prawość. Da mu władzę, aby żył w dobroci i sprawiedliwości, i będzie on chodził w wiecznym świetle."},{"t":"v","v":"5","text":"A grzech zginie w ciemności na zawsze i od tego dnia już nigdy nie będzie go widać."},{"t":"h","text":"Apokalipsa tygodni"}],"notes":{"1":"1","2":"2"}},{"num":93,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Potem Henoch zaczął przekazywać [naukę] z ksiąg."},{"t":"v","v":"2","text":"I Henoch powiedział: O dzieciach sprawiedliwości, o wybranych świata i o roślinie prawości powiem wam te rzeczy. Tak, ja, Henoch, oznajmię je wam, moi synowie: zgodnie z tym, co ukazało mi się w niebiańskim widzeniu, co poznałem ze słów świętych aniołów i czego nauczyłem się z niebiańskich tablic.[[1]]"},{"t":"v","v":"3","text":"I Henoch zaczął opowiadać z ksiąg i powiedział: Urodziłem się jako siódmy, w pierwszym tygodniu, gdy sąd i sprawiedliwość jeszcze trwały.[[2]]"},{"t":"v","v":"4","text":"Po mnie, w drugim tygodniu, powstanie wielka niegodziwość i wyrośnie oszustwo. W nim nastąpi pierwszy koniec i w nim ocaleje jeden człowiek. A gdy [ten tydzień] się dopełni, wzrośnie nieprawość i [Bóg] ustanowi prawo dla grzeszników.[[3]]"},{"t":"v","v":"5","text":"Potem, w trzecim tygodniu, przy jego końcu, zostanie wybrany człowiek jako roślina sprawiedliwego sądu, a jego potomstwo stanie się rośliną sprawiedliwości na wieki.[[4]]"},{"t":"v","v":"6","text":"Potem, w czwartym tygodniu, przy jego końcu, ukażą się widzenia świętych i sprawiedliwych, zostanie dane prawo dla wszystkich pokoleń i zostanie dla nich uczyniona zagroda.[[5]]"},{"t":"v","v":"7","text":"Potem, w piątym tygodniu, przy jego końcu, zostanie zbudowany na wieki dom chwały i panowania.[[6]]"},{"t":"v","v":"8","text":"Potem, w szóstym tygodniu, wszyscy, którzy będą w nim żyli, zostaną zaślepieni, a serca ich wszystkich bezbożnie porzucą mądrość. W nim pewien człowiek wstąpi [do nieba], a przy jego końcu dom panowania spłonie w ogniu i cały ród wybranego korzenia zostanie rozproszony.[[7]]"},{"t":"v","v":"9","text":"Potem, w siódmym tygodniu, powstanie pokolenie odstępcze. Wiele będzie jego czynów, a wszystkie jego czyny będą odstępstwem.[[8]]"},{"t":"v","v":"10","text":"A przy jego końcu spośród wiecznej rośliny sprawiedliwości zostaną wybrani sprawiedliwi wybrańcy, aby otrzymać siedmiokrotną naukę o całym Jego stworzeniu.[[9]]"},{"t":"v","v":"91:11","text":"Potem korzenie nieprawości zostaną odcięte, a grzesznicy zginą od miecza; […] zostaną wycięci bluźniercy na każdym miejscu, a ci, którzy planują przemoc, i ci, którzy popełniają bluźnierstwo, zginą od miecza.[[10]]"},{"t":"v","v":"91:12","text":"Potem nadejdzie inny tydzień - ósmy, tydzień sprawiedliwości. Zostanie mu dany miecz, aby sprawiedliwy sąd został wykonany na ciemięzcach, a grzesznicy zostaną wydani w ręce sprawiedliwych."},{"t":"v","v":"91:13","text":"Przy jego końcu [sprawiedliwi] nabędą domy dzięki swojej sprawiedliwości i zostanie zbudowany dom dla Wielkiego Króla - w chwale, na wieki.[[11]]"},{"t":"v","v":"91:14","text":"Potem, w dziewiątym tygodniu, sprawiedliwy sąd zostanie objawiony całemu światu. Wszystkie dzieła bezbożnych znikną z całej ziemi, świat zostanie zapisany na zagładę, a wszyscy ludzie będą wypatrywać ścieżki prawości."},{"t":"v","v":"91:15","text":"Potem, w dziesiątym tygodniu, w jego siódmej części, odbędzie się wielki wieczny sąd, na którym [Bóg] dokona pomsty wśród aniołów.[[12]]"},{"t":"v","v":"91:16","text":"Pierwsze niebo przeminie i odejdzie, a ukaże się nowe niebo, i wszystkie moce niebios będą świecić siedmiokrotnym światłem."},{"t":"v","v":"91:17","text":"A potem nastanie wiele tygodni bez liczby, na wieki. Wszystko będzie [trwać] w dobroci i sprawiedliwości, a grzechu już nigdy nie będzie się wspominać."},{"t":"h","text":"Wielkość Boga"},{"t":"v","v":"11","text":"Bo któż spośród wszystkich synów ludzkich zdoła usłyszeć głos Świętego i się nie zatrwożyć? Któż zdoła pomyśleć Jego myśli? Któż zdoła spojrzeć na wszystkie dzieła nieba?[[13]]"},{"t":"v","v":"12","text":"Jak miałby istnieć ktoś, kto ujrzy niebo i pojmie jego sprawy? Kto zobaczy duszę albo ducha i zdoła o tym opowiedzieć? Kto wstąpi [do nieba], zobaczy wszystkie jego krańce, ogarnie je myślą albo uczyni coś im podobnego?"},{"t":"v","v":"13","text":"Któż spośród wszystkich ludzi zdoła poznać, jaka jest szerokość i długość ziemi? Komu pokazano wszystkie jej miary?"},{"t":"v","v":"14","text":"Czy jest ktoś, kto zdoła zmierzyć długość nieba - jego wysokość i to, na czym jest osadzone? Kto zna liczbę gwiazd i miejsce, gdzie odpoczywają wszystkie światła?"},{"t":"h","text":"Napomnienia dla sprawiedliwych i biada dla grzeszników"}],"notes":{"1":"3","2":"4","3":"5","4":"6","5":"7","6":"8","7":"9","8":"10","9":"11","10":"12","11":"13","12":"14","13":"15"}},{"num":94,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"A teraz mówię wam, moi synowie: kochajcie sprawiedliwość i według niej postępujcie. Bo ścieżki sprawiedliwości są godne przyjęcia, a ścieżki nieprawości nagle zostaną zniszczone i znikną."},{"t":"v","v":"2","text":"Ludziom pewnego pokolenia zostaną objawione ścieżki przemocy i śmierci, lecz oni będą trzymać się od nich z daleka i nie pójdą za nimi."},{"t":"v","v":"3","text":"A teraz mówię wam, sprawiedliwym: nie chodźcie ścieżkami zła ani ścieżkami śmierci. Nie zbliżajcie się do nich, abyście nie zginęli."},{"t":"v","v":"4","text":"Szukajcie i wybierajcie dla siebie sprawiedliwość i życie godne wybranych. Chodźcie ścieżkami pokoju, a będziecie żyć i dobrze wam się powiedzie."},{"t":"v","v":"5","text":"Zachowujcie moje słowa w myślach waszych serc i nie pozwólcie ich stamtąd wymazać. Wiem bowiem, że grzesznicy będą kusić ludzi, aby krzywdzili mądrość - tak, by nie znalazło się dla niej miejsce i by żadna pokusa nie osłabła.[[1]]"},{"t":"v","v":"6","text":"Biada tym, którzy budują nieprawość i ucisk, a fundament kładą na oszustwie - bo nagle zostaną obaleni i nie zaznają pokoju!"},{"t":"v","v":"7","text":"Biada tym, którzy budują swoje domy grzechem - bo zostaną obaleni z samych fundamentów i padną od miecza! [A ci, którzy zdobywają złoto i srebro, nagle zginą na sądzie.][[2]]"},{"t":"v","v":"8","text":"Biada wam, bogacze! Zaufaliście bowiem swoim bogactwom, ale od swoich bogactw zostaniecie oderwani, bo w dniach swojego bogactwa nie pamiętaliście o Najwyższym."},{"t":"v","v":"9","text":"Popełnialiście bluźnierstwo i nieprawość - i staliście się gotowi na dzień rzezi, na dzień ciemności i na dzień wielkiego sądu."},{"t":"v","v":"10","text":"Tak mówię i tak wam oznajmiam: Ten, który was stworzył, obali was. Nad waszym upadkiem nikt się nie zlituje, a wasz Stwórca będzie się radował z waszej zguby."},{"t":"v","v":"11","text":"A wasi sprawiedliwi będą w tych dniach wyrzutem dla grzeszników i bezbożnych.[[3]]"}],"notes":{"1":"16","2":"17","3":"18"}},{"num":95,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"O, gdyby moje oczy były chmurą wody, abym mógł nad wami płakać i wylewać łzy jak chmura deszczu - i tak odpocząć od udręki mego serca!"},{"t":"v","v":"2","text":"Kto wam pozwolił uprawiać szyderstwo i niegodziwość? Sąd dosięgnie was, grzesznicy!"},{"t":"v","v":"3","text":"Nie bójcie się grzeszników, sprawiedliwi! Pan znów wyda ich w wasze ręce, abyście wykonali nad nimi sąd, jak zechcecie."},{"t":"v","v":"4","text":"Biada wam, którzy rzucacie klątwy nie do cofnięcia! Uzdrowienie będzie od was daleko - z powodu waszych grzechów."},{"t":"v","v":"5","text":"Biada wam, którzy odpłacacie bliźniemu złem - bo odpłacą wam według waszych czynów!"},{"t":"v","v":"6","text":"Biada wam, kłamliwi świadkowie, i wam, którzy odważacie niesprawiedliwość - bo nagle zginiecie![[1]]"},{"t":"v","v":"7","text":"Biada wam, grzesznicy, bo prześladujecie sprawiedliwych! Sami zostaniecie wydani i prześladowani - z powodu niesprawiedliwości - a jej jarzmo ciężko na was zaciąży."}],"notes":{"1":"19"}},{"num":96,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Miejcie nadzieję, sprawiedliwi! Grzesznicy bowiem nagle zginą na waszych oczach, a wy otrzymacie nad nimi władzę, jaką zechcecie."},{"t":"v","v":"2","text":"W dniu udręki grzeszników wasze dzieci wzniosą się i wzlecą jak orły, a wasze gniazdo będzie wyżej niż [gniazdo] sępów. Wzniesiecie się i wejdziecie w rozpadliny ziemi i w szczeliny skał - na zawsze, jak góraliki, [z dala] od niesprawiedliwych. A syreny będą z waszego powodu wzdychać i płakać.[[1]]"},{"t":"v","v":"3","text":"Dlatego nie bójcie się wy, którzy cierpieliście, bo uzdrowienie będzie waszym udziałem: zajaśnieje wam jasne światło, a z nieba usłyszycie głos odpoczynku."},{"t":"v","v":"4","text":"Biada wam, grzesznicy, bo wasze bogactwo upodabnia was do sprawiedliwych, lecz wasze serca dowodzą, że jesteście grzesznikami! To będzie świadectwem przeciwko wam - przypomnieniem [waszych] złych czynów."},{"t":"v","v":"5","text":"Biada wam, którzy pożeracie najlepszą pszenicę, pijecie wino z wielkich czasz i swoją siłą depczecie pokornych![[2]]"},{"t":"v","v":"6","text":"Biada wam, którzy pijecie wodę z każdego źródła - bo nagle zostaniecie strawieni i uschniecie, ponieważ porzuciliście źródło życia!"},{"t":"v","v":"7","text":"Biada wam, którzy czynicie nieprawość, oszustwo i bluźnierstwo - będzie to przypomnieniem przeciwko wam, na [wasze] zło!"},{"t":"v","v":"8","text":"Biada wam, mocarze, którzy siłą uciskacie sprawiedliwego - bo nadchodzi dzień waszej zagłady! W tych dniach - w dniu waszego sądu - nastanie dla sprawiedliwych wiele dobrych dni."}],"notes":{"1":"20","2":"21"}},{"num":97,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Wierzcie, sprawiedliwi: grzesznicy staną się hańbą i zginą w dniu nieprawości."},{"t":"v","v":"2","text":"Wiedzcie, [grzesznicy], że Najwyższy pamięta o waszej zagładzie i że aniołowie nieba radują się z waszej zguby."},{"t":"v","v":"3","text":"Co zrobicie, grzesznicy, i dokąd uciekniecie w owym dniu sądu, gdy usłyszycie głos modlitwy sprawiedliwych?"},{"t":"v","v":"4","text":"Stanie się z wami tak jak z tymi, przeciwko którym te słowa będą świadectwem: „Byliście wspólnikami grzeszników”."},{"t":"v","v":"5","text":"W tych dniach modlitwa sprawiedliwych dotrze do Pana, a dla was nadejdą dni waszego sądu."},{"t":"v","v":"6","text":"Wszystkie słowa waszej nieprawości zostaną odczytane przed Wielkim i Świętym. Wasze twarze okryją się wstydem, a On odrzuci każde dzieło zbudowane na nieprawości."},{"t":"v","v":"7","text":"Biada wam, grzesznicy, którzy mieszkacie na środku morza i na suchym lądzie - [sama] pamięć o was świadczy przeciwko wam!"},{"t":"v","v":"8","text":"Biada wam, którzy zdobywacie srebro i złoto nieuczciwie, a mówicie: „Wzbogaciliśmy się, mamy majątki, zdobyliśmy wszystko, czego zapragnęliśmy."},{"t":"v","v":"9","text":"Teraz zróbmy, co zamierzyliśmy: bo nagromadziliśmy srebra, w naszych domach pracuje wielu robotników, a nasze spichlerze są pełne - po brzegi, jak wody”.[[1]]"},{"t":"v","v":"10","text":"Jak woda rozpłynie się wasze kłamstwo. Wasze bogactwo nie przetrwa - szybko od was odejdzie, bo wszystko zdobyliście nieuczciwie. I zostaniecie wydani wielkiemu przekleństwu."}],"notes":{"1":"22"}},{"num":98,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"A teraz przysięgam wam, mądrym i głupim: doświadczycie na ziemi wielu rzeczy."},{"t":"v","v":"2","text":"Wy, mężczyźni, będziecie się stroić bardziej niż kobieta i wkładać barwniejsze szaty niż panna - w królewskość, w wielkość i w moc. A srebro, złoto, purpura, przepych i jedzenie będą się [u was] lać jak woda."},{"t":"v","v":"3","text":"Dlatego zabraknie im nauki i mądrości. Przez to zginą razem ze swoimi majątkami, z całą swoją chwałą i przepychem, a ich duchy - w hańbie, w rzezi i w wielkiej nędzy - zostaną wrzucone do pieca ognia."},{"t":"v","v":"4","text":"Przysięgam wam, grzesznicy: jak góra nie stała się niewolnikiem ani wzgórze służącą kobiety, tak grzech nie został zesłany na ziemię - to człowiek sam go stworzył. I wielkie przekleństwo spadnie na tych, którzy go popełniają.[[1]]"},{"t":"v","v":"5","text":"Kobiecie nie dano bezpłodności - to z powodu czynów własnych rąk umiera bezdzietna."},{"t":"v","v":"6","text":"Przysięgam wam, grzesznicy, na Świętego i Wielkiego: wszystkie wasze złe czyny są jawne w niebiosach i żaden z waszych czynów ucisku nie jest zakryty ani ukryty."},{"t":"v","v":"7","text":"Nie myślcie w swoim duchu i nie mówcie w swoim sercu, że nie wiecie i nie widzicie,"},{"t":"v","v":"8","text":"iż każdy grzech jest codziennie zapisywany w niebie, przed Najwyższym. Odtąd wiecie: cały ucisk, który zadajecie, jest zapisywany dzień po dniu - aż do dnia waszego sądu."},{"t":"v","v":"9","text":"Biada wam, głupcy - bo zginiecie przez swoją głupotę! Występujecie przeciw mądrym -"},{"t":"v","v":"10","text":"i dobro nie będzie waszym udziałem. Wiedzcie więc, że jesteście gotowi na dzień zagłady. Nie liczcie na to, że przeżyjecie, grzesznicy. Odejdziecie i umrzecie, bo nie ma za was okupu.[[2]] Jesteście bowiem przygotowani na dzień wielkiego sądu, na dzień udręki i wielkiej hańby dla waszych duchów."},{"t":"v","v":"11","text":"Biada wam, zatwardziałego serca, którzy czynicie zło i jecie krew![[3]] Skąd macie tyle dobrego, aby jeść, pić i się nasycać? Ze wszystkich dóbr, które Pan, Najwyższy, złożył w obfitości na ziemi. Nie zaznacie pokoju!"},{"t":"v","v":"12","text":"Biada wam, którzy kochacie czyny nieprawości! Czemu spodziewacie się dla siebie dobra? Wiedzcie, że zostaniecie wydani w ręce sprawiedliwych: poderżną wam gardła, zabiją was i nie będą mieć nad wami litości."},{"t":"v","v":"13","text":"Biada wam, którzy cieszycie się z udręki sprawiedliwych - bo nikt nie wykopie wam grobu!"},{"t":"v","v":"14","text":"Biada wam, którzy lekceważycie słowa sprawiedliwych - bo nie będziecie mieć nadziei życia!"},{"t":"v","v":"15","text":"Biada wam, którzy spisujecie słowa kłamliwe i bezbożne! Piszą bowiem swoje kłamstwa po to, aby ludzie ich słuchali i wyrządzali zło bliźniemu.[[4]]"},{"t":"v","v":"16","text":"Dlatego nie zaznają pokoju, lecz umrą nagłą śmiercią."}],"notes":{"1":"23","2":"24","3":"25","4":"26"}},{"num":99,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Biada wam, którzy czynicie bezbożność, chlubicie się kłamstwem i je wychwalacie - zginiecie i nie będzie dla was szczęśliwego życia!"},{"t":"v","v":"2","text":"Biada tym, którzy przekręcają słowa prawości! Łamią wieczne Prawo i czynią z siebie tych, kim nie byli - [grzeszników]. Zostaną wdeptani w ziemię.[[1]]"},{"t":"v","v":"3","text":"W tych dniach przygotujcie się, sprawiedliwi, aby wznieść swoje modlitwy jako przypomnienie i złożyć je jako świadectwo przed aniołami - aby oni przedstawili grzech grzeszników przed Najwyższym, na przypomnienie."},{"t":"v","v":"4","text":"W tych dniach narody zostaną wzburzone, a rody narodów powstaną w dniu zagłady."},{"t":"v","v":"5","text":"W tych dniach nędzarze wyjdą i porwą swoje dzieci, i porzucą je, tak że ich dzieci przez nich zginą. Porzucą swoje niemowlęta, [jeszcze] ssące, i nie wrócą do nich, i nie zlitują się nad swoimi ukochanymi."},{"t":"v","v":"6","text":"I znowu przysięgam wam, grzesznicy: grzech jest przygotowany na dzień nieustannego rozlewu krwi."},{"t":"v","v":"7","text":"Ci, którzy czczą kamienie, którzy rzeźbią posągi ze złota, srebra, drewna [i kamienia], i gliny, i ci, którzy - nieświadomi - czczą duchy nieczyste, demony i wszelkie bożki, nie znajdą u nich żadnej pomocy.[[2]]"},{"t":"v","v":"8","text":"Staną się bezbożni przez głupotę swoich serc, a ich oczy zostaną zaślepione przez lęk ich serc i przez widzenia sennych marzeń."},{"t":"v","v":"9","text":"Przez nie staną się bezbożni i pełni lęku, bo całe swoje dzieło uczynili w kłamstwie i oddawali cześć kamieniowi. Dlatego zginą w jednej chwili."},{"t":"v","v":"10","text":"Ale w tych dniach błogosławieni będą wszyscy, którzy przyjmują słowa mądrości i je rozumieją, którzy strzegą ścieżek Najwyższego, chodzą ścieżką Jego sprawiedliwości i nie stają się bezbożni z bezbożnymi - bo oni będą zbawieni."},{"t":"v","v":"11","text":"Biada wam, którzy szerzycie zło wśród swoich bliźnich - bo zostaniecie zabici w Szeolu [krainie umarłych]!"},{"t":"v","v":"12","text":"Biada wam, którzy stosujecie oszukańcze i fałszywe miary, i tym, którzy powodują gorycz na ziemi - bo przez to zostaną doszczętnie zniszczeni!"},{"t":"v","v":"13","text":"Biada wam, którzy budujecie swoje domy ciężkim trudem innych, a całym waszym budulcem są cegły i kamienie grzechu! Mówię wam: Nie zaznacie pokoju!"},{"t":"v","v":"14","text":"Biada tym, którzy odrzucają miarę i wieczne dziedzictwo swoich ojców, a swoje dusze każą iść za bożkami - bo nie zaznają odpoczynku![[3]]"},{"t":"v","v":"15","text":"Biada tym, którzy czynią nieprawość, wspierają ucisk i zabijają swoich bliźnich - aż do dnia wielkiego sądu!"},{"t":"v","v":"16","text":"Bo On strąci waszą chwałę, sprowadzi udrękę na wasze serca, wzbudzi swój płomienny gniew i wytraci was wszystkich mieczem. A wszyscy święci i sprawiedliwi będą pamiętać wasze grzechy."}],"notes":{"1":"27","2":"28","3":"29"}},{"num":100,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"W tych dniach ojcowie razem z synami zostaną pobici w jednym miejscu, a bracia będą padać martwi jedni obok drugich - aż strumienie popłyną ich krwią."},{"t":"v","v":"2","text":"Bo mężczyzna nie powstrzyma ręki od zabicia swoich synów i synów swoich synów, a grzesznik nie powstrzyma ręki od swojego czcigodnego brata. Od świtu do zachodu słońca będą się wzajemnie zabijać."},{"t":"v","v":"3","text":"Koń będzie brodził po pierś we krwi grzeszników, a rydwan zanurzy się [w niej] po samą górę.[[1]]"},{"t":"v","v":"4","text":"W tych dniach aniołowie zstąpią do kryjówek i zgromadzą w jednym miejscu wszystkich, którzy sprowadzili grzech. W owym dniu Najwyższy powstanie, aby dokonać wielkiego sądu nad grzesznikami.[[2]]"},{"t":"v","v":"5","text":"A nad wszystkimi sprawiedliwymi i świętymi ustanowi straż ze świętych aniołów. Będą ich strzec jak źrenicy oka, aż On położy kres wszelkiemu złu i wszelkiemu grzechowi. I choćby sprawiedliwi spali długim snem, nie mają się czego bać.[[3]]"},{"t":"v","v":"6","text":"Wtedy synowie ziemi zobaczą mądrych [żyjących] bezpiecznie i zrozumieją wszystkie słowa tej księgi. I poznają, że bogactwo nie zdoła ich ocalić w upadku, [który sprowadzą] ich grzechy."},{"t":"v","v":"7","text":"Biada wam, grzesznicy, w dniu wielkiej udręki - wam, którzy dręczycie sprawiedliwych i palicie ich ogniem! Otrzymacie odpłatę według waszych czynów."},{"t":"v","v":"8","text":"Biada wam, zatwardziałego serca, którzy czuwacie po to, aby obmyślać zło! Padnie na was strach i nikt wam nie pomoże."},{"t":"v","v":"9","text":"Biada wam, grzesznicy - z powodu słów waszych ust i z powodu czynów waszych rąk, których dokonała wasza bezbożność! Będziecie płonąć w buchających płomieniach, gorętszych niż ogień."},{"t":"v","v":"10","text":"A teraz wiedzcie: On wypyta aniołów w niebie o wasze czyny, a słońce, księżyc i gwiazdy - o wasze grzechy, bo na ziemi wykonujecie sąd nad sprawiedliwymi."},{"t":"v","v":"11","text":"I wezwie na świadków przeciwko wam każdy obłok, mgłę, rosę i deszcz - bo wszystkie zostaną przez wzgląd na was powstrzymane, aby na was nie zstępować, i będą pamiętać o waszych grzechach.[[4]]"},{"t":"v","v":"12","text":"Spróbujcie więc teraz dać deszczowi podarunki, żeby nie został przed wami powstrzymany, i rosie - może zstąpi, jeśli przyjmie od was złoto i srebro.[[5]]"},{"t":"v","v":"13","text":"A gdy w tych dniach spadną na was szron i śnieg ze swoim mrozem i wszystkie śnieżne wichry ze wszystkimi swoimi plagami - nie zdołacie się przed nimi ostać."}],"notes":{"1":"30","2":"31","3":"32","4":"33","5":"34"}},{"num":101,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Przyjrzyjcie się niebu, wy wszyscy, synowie nieba, i każdemu dziełu Najwyższego. Bójcie się Go i nie czyńcie zła w Jego obecności."},{"t":"v","v":"2","text":"Jeśli zamknie okna nieba i przez wzgląd na was powstrzyma deszcz i rosę, tak że nie spadną na ziemię - co wtedy zrobicie?"},{"t":"v","v":"3","text":"A jeśli za wasze czyny ześle na was swój gniew, nie zdołacie Go uprosić. Wypowiadaliście przecież pyszne i zuchwałe słowa przeciwko Jego sprawiedliwości. Dlatego nie zaznacie pokoju!"},{"t":"v","v":"4","text":"Czy nie widzicie kapitanów statków[[1]] - jak fale miotają ich okrętami, jak szarpią nimi wichry, w jak wielkiej są udręce?"},{"t":"v","v":"5","text":"Dlatego się boją: całe ich cenne mienie płynie razem z nimi po morzu, więc w sercach przeczuwają najgorsze - że morze ich pochłonie i że w nim zginą."},{"t":"v","v":"6","text":"Czy całe morze, wszystkie jego wody i każdy ich ruch nie są dziełem Najwyższego? Czy to nie On wyznaczył granicę temu, co morze może czynić, i ze wszystkich stron zamknął je piaskiem?"},{"t":"v","v":"7","text":"Gdy On grozi, morze lęka się i wysycha, a jego ryby i wszystko, co w nim żyje, ginie. A wy, grzesznicy mieszkający na ziemi, wy się Go nie boicie."},{"t":"v","v":"8","text":"Czy to nie On uczynił niebo i ziemię, i wszystko, co w nich jest? Kto dał rozum i mądrość wszystkiemu, co porusza się po ziemi i w morzu?"},{"t":"v","v":"9","text":"Czy kapitanowie statków nie boją się morza? A jednak grzesznicy nie boją się Najwyższego!"}],"notes":{"1":"35"}},{"num":102,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"W owych dniach, gdy [Najwyższy] roznieci przeciwko wam gwałtowny ogień, dokąd uciekniecie i gdzie znajdziecie ratunek? A gdy wypowie przeciwko wam swoje słowo, czy nie ogarnie was strach i przerażenie?"},{"t":"v","v":"2","text":"Wszystkie światła [nieba] zadrżą w wielkim strachu, a cała ziemia struchleje, zatrzęsie się i ogarnie ją trwoga."},{"t":"v","v":"3","text":"Wszyscy aniołowie wykonają to, co im rozkazano, i będą chcieli skryć się przed obliczem Wielkiej Chwały[[1]], a dzieci ziemi zadrżą i się zatrzęsą. Wy zaś, grzesznicy, będziecie przeklęci na wieki i nie zaznacie pokoju!"},{"t":"v","v":"4","text":"Nie bójcie się, dusze sprawiedliwych! Miejcie nadzieję, wy, którzy umarliście w sprawiedliwości!"},{"t":"v","v":"5","text":"Nie smućcie się, że wasza dusza zeszła do Szeolu w smutku i że za życia wasze ciało nie otrzymało tego, na co zasługiwała wasza dobroć. Czekajcie raczej na dzień sądu nad grzesznikami, na dzień przekleństwa i kary.[[2]]"},{"t":"v","v":"6","text":"Bo gdy umieracie, grzesznicy mówią nad wami: „Sprawiedliwi umarli tak samo, jak my umieramy. Jaki pożytek mieli ze swoich uczynków?"},{"t":"v","v":"7","text":"Patrzcie: umarli w smutku i w ciemności, zupełnie jak my. Czym nas przewyższyli? Odtąd jesteśmy równi."},{"t":"v","v":"8","text":"Co otrzymają i co będą oglądać na wieki? Przecież i oni umarli - i odtąd już nigdy nie zobaczą światła”.[[3]]"},{"t":"v","v":"9","text":"Mówię wam, grzesznicy: wystarcza wam, że jecie i pijecie, że grabicie ludzi i grzeszycie, że obdzieracie ich do naga, że zdobywacie majątek i oglądacie dobre dni."},{"t":"v","v":"10","text":"A czy widzieliście sprawiedliwych - jaki był ich koniec? Aż do dnia śmierci nie znaleziono w nich żadnej przemocy."},{"t":"v","v":"11","text":"A jednak zginęli i stali się, jakby ich nigdy nie było, a ich duchy zeszły w udręce do Szeolu."}],"notes":{"1":"36","2":"37","3":"38"}},{"num":103,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"A teraz przysięgam wam, sprawiedliwi, na chwałę Wielkiego, Czcigodnego i Potężnego w panowaniu - na Jego wielkość wam przysięgam:"},{"t":"v","v":"2","text":"znam pewną tajemnicę. Czytałem tabliczki nieba, widziałem księgi świętych i znalazłem w nich zapisane i wyryte to, co dotyczy [zmarłych sprawiedliwych]:"},{"t":"v","v":"3","text":"że dla duchów tych, którzy umarli w sprawiedliwości, przygotowano i zapisano wszelkie dobro, radość i cześć; że w zamian za wasze trudy otrzymacie wiele dobra i że wasz dział będzie o wiele lepszy niż dział żywych."},{"t":"v","v":"4","text":"Duchy tych z was, którzy umarli w sprawiedliwości, będą żyć i się radować. Ich duchy nie zginą, a pamięć o nich [nie zniknie] sprzed oblicza Wielkiego przez wszystkie pokolenia świata. Dlatego nie bójcie się już zniewag [grzeszników]."},{"t":"v","v":"5","text":"Biada wam, grzesznicy, gdy umrzecie w bogactwie waszych grzechów, a podobni do was powiedzą o was: „Szczęśliwi ci grzesznicy! Widzieli wszystkie swoje dni."},{"t":"v","v":"6","text":"Umarli w dostatku i bogactwie, nie zaznali w życiu udręki ani mordu. Umarli w chwale, a za ich życia nie wykonano na nich wyroku”."},{"t":"v","v":"7","text":"Wiedzcie, że ich dusze zostaną strącone do Szeolu i będą nieszczęsne w swojej wielkiej udręce."},{"t":"v","v":"8","text":"W ciemność, w kajdany i w palący płomień - na surowy sąd - wejdą wasze duchy, a wielki sąd będzie trwał przez wszystkie pokolenia świata. Biada wam, bo nie zaznacie pokoju!"},{"t":"v","v":"9","text":"Nie mówcie o sprawiedliwych i dobrych, którzy żyją [na ziemi]:[[1]] „W dniach naszej udręki trudziliśmy się mozolnie i zaznaliśmy wszelkiego utrapienia. Spotkało nas wiele zła i zostaliśmy wyniszczeni. Było nas coraz mniej, a nasz duch osłabł."},{"t":"v","v":"10","text":"Niszczono nas i nikt nie pomógł nam nawet słowem. Torturowano nas [i niszczono], a my nie liczyliśmy już, że dożyjemy następnego dnia."},{"t":"v","v":"11","text":"Mieliśmy nadzieję być głową, a staliśmy się ogonem.[[2]] Trudziliśmy się mozolnie, ale nasz trud nie przyniósł nam nic. Staliśmy się pokarmem grzeszników i niegodziwych, a oni całym ciężarem złożyli na nas swoje jarzmo."},{"t":"v","v":"12","text":"Panowali nad nami ci, którzy nas nienawidzili i bili. Przed tymi, którzy nas nienawidzili, schylaliśmy karki, ale oni nie mieli dla nas litości."},{"t":"v","v":"13","text":"Chcieliśmy od nich odejść, żeby uciec i zaznać spokoju, ale nie znaleźliśmy miejsca, dokąd moglibyśmy zbiec i skryć się przed nimi."},{"t":"v","v":"14","text":"W naszej udręce skarżyliśmy się na nich władcom i wołaliśmy przeciwko tym, którzy nas pożerali, ale [władcy] nie zważali na nasze wołanie i nie chcieli słuchać naszego głosu."},{"t":"v","v":"15","text":"Pomagali za to tym, którzy nas grabili i pożerali, i tym, którzy nas przetrzebili. Kryli ich przemoc i nie zdjęli z nas jarzma tych, którzy nas pożerali, rozpraszali i mordowali. Kryli ich morderstwa i nie pamiętali, że [tamci] podnieśli rękę przeciwko nam”."}],"notes":{"1":"39","2":"40"}},{"num":104,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"Przysięgam wam, sprawiedliwi: aniołowie w niebie pamiętają o was ku dobremu przed chwałą Wielkiego, a wasze imiona są zapisane przed Jego chwałą."},{"t":"v","v":"2","text":"Miejcie nadzieję! Kiedyś poniżało was zło i udręka, ale teraz zajaśniejecie jak światła nieba.[[1]] Będziecie jaśnieć i będą was widzieć, a bramy nieba staną przed wami otworem."},{"t":"v","v":"3","text":"Wołajcie - wołajcie o sąd, a on się wam ukaże. Za całą waszą udrękę odpowiedzą władcy i wszyscy, którzy pomagali tym, co was łupili."},{"t":"v","v":"4","text":"Miejcie nadzieję i nie porzucajcie jej, bo czeka was wielka radość - jak aniołów w niebie."},{"t":"v","v":"5","text":"Co będziecie musieli zrobić? Nie będziecie musieli ukrywać się w dniu wielkiego sądu. Nikt nie uzna was za grzeszników, a wieczny wyrok będzie od was daleko przez wszystkie pokolenia świata."},{"t":"v","v":"6","text":"Nie bójcie się więc, sprawiedliwi, gdy widzicie, jak grzesznicy rosną w siłę i jak dobrze im się wiedzie na ich drogach. Nie łączcie się z nimi i trzymajcie się z dala od ich przemocy, bo wy macie się stać towarzyszami zastępów nieba."},{"t":"v","v":"7","text":"Wy, grzesznicy, mówicie wprawdzie: „Nikt nie wyśledzi i nie zapisze wszystkich naszych grzechów”. A jednak wasze grzechy będą zapisywane dzień po dniu - wszystkie."},{"t":"v","v":"8","text":"Teraz pokazuję wam, że światło i ciemność, dzień i noc widzą wszystkie wasze grzechy."},{"t":"v","v":"9","text":"Nie bądźcie bezbożni w swoich sercach. Nie kłamcie, nie zmieniajcie słów prawdy i nie zarzucajcie kłamstwa słowom Świętego i Wielkiego. Nie oglądajcie się na swoje bożki, bo wszystkie wasze kłamstwa i cała wasza bezbożność nie prowadzą do sprawiedliwości, lecz do wielkiego grzechu."},{"t":"v","v":"10","text":"A teraz znam tę tajemnicę: wielu grzeszników będzie zmieniać i przekręcać słowa prawdy. Będą mówić słowa złe, będą kłamać, dopuszczać się wielkich oszustw i pisać księgi we własnym imieniu.[[2]]"},{"t":"v","v":"11","text":"Ale gdy zapiszą wiernie w swoich językach wszystkie moje słowa, gdy niczego w nich nie zmienią ani nie ujmą, lecz zapiszą wiernie wszystko, o czym od początku świadczyłem,"},{"t":"v","v":"12","text":"wtedy - znam i tę drugą tajemnicę - księgi zostaną dane sprawiedliwym i mądrym i staną się źródłem radości, prawości i wielkiej mądrości."},{"t":"v","v":"13","text":"Tak, księgi zostaną im dane, a oni w nie uwierzą i będą się nimi radować. Wtedy wszyscy sprawiedliwi, którzy poznali z nich wszystkie drogi prawości, otrzymają zapłatę."}],"notes":{"1":"41","2":"42"}},{"num":105,"part":"List Henocha","blocks":[{"t":"v","v":"1","text":"W owych dniach - mówi Pan - wezwą dzieci ziemi i złożą przed nimi świadectwo o swojej mądrości. Pokażcie im ją! Wy przecież jesteście ich przewodnikami i nagrodą na całej ziemi."},{"t":"v","v":"2","text":"Bo Ja i mój Syn[[1]] połączymy się z nimi na zawsze na drogach prawości za ich życia. I zaznacie pokoju. Radujcie się, dzieci prawości! Amen."}],"notes":{"1":"43"}},{"num":106,"part":"Apokalipsa Noego","blocks":[{"t":"v","v":"1","text":"Po pewnym czasie mój syn Matuzalem wziął dla swojego syna Lamecha żonę. Poczęła z niego i urodziła syna.[[1]]"},{"t":"v","v":"2","text":"Jego ciało było białe jak śnieg i czerwone jak rozkwitła róża, a włosy na jego głowie i jego długie loki [były] białe jak wełna. Oczy miał piękne. Gdy je otworzył, rozświetlił cały dom jak słońce - cały dom zajaśniał."},{"t":"v","v":"3","text":"Zaraz potem podniósł się w rękach położnej, otworzył usta i rozmawiał z Panem sprawiedliwości."},{"t":"v","v":"4","text":"Jego ojciec Lamech przestraszył się go, uciekł i przyszedł do swojego ojca Matuzalema."},{"t":"v","v":"5","text":"Powiedział mu: „Urodził mi się dziwny syn. Nie jest podobny do człowieka - przypomina synów Boga nieba. Jest innej natury, niepodobny do nas. Jego oczy są jak promienie słońca, a twarz pełna chwały."},{"t":"v","v":"6","text":"Wydaje mi się, że nie pochodzi ode mnie, lecz od aniołów. Boję się, że za jego dni stanie się na ziemi coś przedziwnego."},{"t":"v","v":"7","text":"A teraz, mój ojcze, proszę cię usilnie i błagam: idź do naszego ojca Henocha i poznaj od niego prawdę, bo on mieszka wśród aniołów”."},{"t":"v","v":"8","text":"Gdy Matuzalem usłyszał słowa swojego syna, przyszedł do mnie na krańce ziemi, bo usłyszał, że tam przebywam. Zawołał głośno, a ja usłyszałem jego głos i przyszedłem do niego. Powiedziałem mu: „Jestem tu, mój synu. Po co do mnie przyszedłeś?”"},{"t":"v","v":"9","text":"Odpowiedział: „Przyszedłem do ciebie z powodu wielkiej troski, zbliżyłem się do ciebie z powodu niepokojącego widzenia."},{"t":"v","v":"10","text":"A teraz posłuchaj mnie, ojcze. Mojemu synowi Lamechowi urodził się syn, jakiego jeszcze nie było, a jego natura nie jest naturą człowieka. Barwa jego ciała jest bielsza niż śnieg i czerwieńsza niż rozkwitła róża, włosy na jego głowie są bielsze niż biała wełna, a jego oczy są jak promienie słońca. Otworzył oczy i rozświetlił cały dom."},{"t":"v","v":"11","text":"Podniósł się w rękach położnej, otworzył usta i błogosławił Pana nieba."},{"t":"v","v":"12","text":"Jego ojciec Lamech przestraszył się i uciekł do mnie. Nie wierzy, że [chłopiec] pochodzi od niego; [sądzi], że jest na podobieństwo aniołów nieba. I dlatego przyszedłem do ciebie, abyś mi oznajmił prawdę”."},{"t":"v","v":"13","text":"A ja, Henoch, odpowiedziałem mu: „Pan dokona na ziemi nowej rzeczy. Widziałem to już w widzeniu i oznajmiam ci: za pokolenia mojego ojca Jareda[[2]] niektórzy aniołowie nieba przekroczyli słowo Pana."},{"t":"v","v":"14","text":"Popełnili grzech i przekroczyli prawo. Połączyli się z kobietami, zgrzeszyli z nimi, niektóre z nich poślubili i mieli z nimi dzieci."},{"t":"v","v":"15","text":"Na całą ziemię przyjdzie wielka zagłada: nastanie potop i przez cały rok będzie [trwać] wielkie zniszczenie."},{"t":"v","v":"16","text":"Ale to dziecko, które wam się urodziło, ocaleje na ziemi, a razem z nim uratują się jego trzej synowie. Gdy wszyscy ludzie na ziemi wymrą, on i jego synowie zostaną ocaleni."},{"t":"v","v":"17","text":"Zrodzą na ziemi olbrzymów - nie z ducha, lecz z ciała. [Dlatego] przyjdzie na ziemię wielka kara i ziemia zostanie oczyszczona z wszelkiego zepsucia.[[3]]"},{"t":"v","v":"18","text":"A teraz oznajmij swojemu synowi Lamechowi, że ten, który mu się urodził, naprawdę jest jego synem. Nadaj mu imię Noe, bo on pozostanie wam [jako reszta]. On i jego synowie zostaną ocaleni z zagłady, która przyjdzie na ziemię z powodu całego grzechu i całej nieprawości - [z powodu tego], co dopełni się na ziemi za jego dni."},{"t":"v","v":"19","text":"Potem jednak nastanie nieprawość jeszcze większa niż ta, która dopełniła się na ziemi wcześniej. Znam bowiem tajemnice świętych: Pan mi je pokazał i objawił, a ja przeczytałem je na tabliczkach nieba."}],"notes":{"1":"1","2":"2","3":"3"}},{"num":107,"part":"Apokalipsa Noego","blocks":[{"t":"v","v":"1","text":"Zobaczyłem, że jest na nich zapisane, iż pokolenie za pokoleniem będzie czynić zło, aż powstanie pokolenie sprawiedliwości. [Wtedy] zło zostanie zniszczone, grzech zniknie z ziemi, a na nią przyjdzie wszelkie dobro."},{"t":"v","v":"2","text":"A teraz, mój synu, idź i oznajmij swojemu synowi Lamechowi, że dziecko, które się urodziło, naprawdę jest jego synem i że nie ma w tym kłamstwa”."},{"t":"v","v":"3","text":"Gdy Matuzalem usłyszał słowa swojego ojca Henocha - bo [Henoch] pokazał mu wszystko, co ukryte - wrócił, przekazał je [Lamechowi] i nadał temu dziecku imię Noe, bo on pocieszy ziemię po całej zagładzie.[[1]]"}],"notes":{"1":"4"}},{"num":108,"part":"Dodatek końcowy","blocks":[{"t":"v","v":"1","text":"Inna księga, którą Henoch napisał dla swojego syna Matuzalema i dla tych, którzy przyjdą po nim i będą zachowywać Prawo w dniach ostatecznych.[[1]]"},{"t":"v","v":"2","text":"Wy, którzy czyniliście dobro, czekajcie na owe dni - aż nadejdzie koniec czyniących zło i skończy się siła przestępców."},{"t":"v","v":"3","text":"Czekajcie, aż przeminie grzech. Ich imiona zostaną bowiem wymazane z księgi życia i z ksiąg świętych, a ich potomstwo zginie na zawsze. Ich duchy zostaną zabite: będą krzyczeć i zawodzić na bezładnym pustkowiu i będą płonąć w ogniu, bo nie ma tam ziemi."},{"t":"v","v":"4","text":"Zobaczyłem tam coś jakby obłok, którego nie dało się przejrzeć - był tak głęboki, że nie mogłem sięgnąć wzrokiem ponad niego. Widziałem jasno buchający płomień ognia i [coś] jakby świecące góry, które wirowały i przetaczały się z miejsca na miejsce."},{"t":"v","v":"5","text":"Zapytałem jednego ze świętych aniołów, którzy byli ze mną: „Co to za jaśniejące [miejsce]? Przecież to nie jest niebo, tylko płomień buchającego ognia oraz głos płaczu, krzyku, lamentu i dotkliwego bólu”."},{"t":"v","v":"6","text":"Powiedział mi: „Miejsce, które widzisz - właśnie tam wtrąca się duchy grzeszników i bluźnierców, tych, którzy czynią zło, i tych, którzy przekręcają wszystko, co Pan powiedział przez usta proroków o rzeczach przyszłych."},{"t":"v","v":"7","text":"Niektóre z tych rzeczy zapisano bowiem i utrwalono w górze, w niebie, aby aniołowie mogli je czytać i wiedzieć, co spotka grzeszników, a co duchy pokornych - tych, którzy trapili swoje ciała i otrzymali od Boga zapłatę, oraz tych, których źli ludzie okrywali hańbą."},{"t":"v","v":"8","text":"To ci, którzy kochali Boga, a nie kochali złota ani srebra, ani żadnych dóbr tego świata - swoje ciała wydali na udrękę."},{"t":"v","v":"9","text":"To ci, którzy odkąd zaistnieli, nie pragnęli ziemskiego pokarmu, ale wszystko uważali za przemijające tchnienie i według tego żyli. Pan wypróbował ich wielokrotnie, a ich duchy okazały się czyste, by mogły błogosławić Jego imię”."},{"t":"v","v":"10","text":"Wszystkie błogosławieństwa, które są dla nich przeznaczone, opisałem w księgach. [Bóg] wyznaczył im zapłatę, bo okazało się, że umiłowali niebo bardziej niż własne życie na świecie. Choć źli ludzie ich deptali, choć znosili od nich obelgi i szyderstwa i okrywano ich hańbą - oni Mnie błogosławili.[[2]]"},{"t":"v","v":"11","text":"A teraz przywołam duchy dobrych, [tych] z pokolenia światła, i przemienię tych, którzy urodzili się w ciemności i którym w ciele nie oddano czci, na jaką zasługiwała ich wierność."},{"t":"v","v":"12","text":"Wyprowadzę w jaśniejące światło tych, którzy umiłowali moje święte imię, i posadzę każdego z nich na tronie jego chwały."},{"t":"v","v":"13","text":"Będą jaśnieć przez czasy niezliczone, bo sądem Boga jest sprawiedliwość: wiernym okaże wierność w przybytku prawych dróg."},{"t":"v","v":"14","text":"I zobaczą, jak ci, którzy urodzili się w ciemności, zostaną wrzuceni w ciemność, podczas gdy sprawiedliwi będą jaśnieć."},{"t":"v","v":"15","text":"Grzesznicy będą głośno krzyczeć, widząc, jak tamci jaśnieją, a sami pójdą tam, gdzie wyznaczono im dni i czasy."},{"t":"p","text":"Tu kończy się widzenie Henocha.[[3]]"}],"notes":{"1":"1","2":"2","3":"3"}}],"front":{"o-ksiedze":[{"tag":"h2","text":"O księdze"},{"tag":"p","text":"Księga Henocha to jedno z najważniejszych dzieł religijnych starożytnego judaizmu spoza kanonu Biblii hebrajskiej. Jej bohaterem jest Henoch - patriarcha sprzed potopu, siódmy po Adamie, o którym Księga Rodzaju mówi tylko tyle, że „chodził z Bogiem, a potem już go nie było, bo Bóg go zabrał” (Rdz 5,24). Wokół tej jednej zagadkowej wzmianki narosła cała literatura: Henoch stał się w niej człowiekiem, który jeszcze za życia został wprowadzony w tajemnice nieba i historii, i który przekazał je swoim potomkom na piśmie."},{"tag":"p","text":"Istnieją trzy starożytne księgi przypisywane Henochowi: etiopska (1 Henoch - ta, którą trzymasz w ręku), słowiańska (2 Henoch) i hebrajska (3 Henoch). Pierwsza jest najstarsza i najważniejsza. Nie jest dziełem jednego autora - to zbiór pięciu ksiąg powstających stopniowo od IV/III wieku przed Chr. do I wieku po Chr., połączonych postacią Henocha:"},{"tag":"p","text":"Księga była szeroko czytana w judaizmie przełomu er i w młodym chrześcijaństwie. Nowy Testament cytuje ją wprost: List Judy 14-15 przytacza Hen 1,9 jako proroctwo Henocha. Z czasem jednak wypadła z obiegu i na Zachodzie uchodziła za zaginioną - przetrwała w całości tylko w Etiopii, gdzie do dziś należy do kanonu Pisma Świętego tamtejszego Kościoła. Europa odzyskała ją w 1773 roku, gdy szkocki podróżnik James Bruce przywiózł z Abisynii jej rękopisy."}],"wydanie":[{"tag":"h2","text":"O tym wydaniu i licencja"},{"tag":"p","text":"Tytuł: Księga Henocha (1 Henoch, Księga Henocha etiopska) Autor: Henoch Przekład: nowy przekład na współczesny język polski Redakcja: Fable 5.1 (model AI) Data redakcji: 20 września 2026 Wydanie: chrzescijanie-rzeszow.pl"},{"tag":"p","text":"Podstawą przekładu jest tekst etiopski (ge’ez), jedyny pełny świadek księgi, poprawiany według zachowanych fragmentów greckich (kodeks z Akhmim, cytaty Synkellosa, papirus Chester Beatty) oraz aramejskich zwojów z Qumran (4Q201-4Q212). Przy lekcjach spornych punktem odniesienia był krytyczny przekład R.H. Charlesa (1912/1917), pozostający w domenie publicznej, oraz późniejsze ustalenia badaczy (Knibb; Nickelsburg-VanderKam). Szczegóły w Nocie redakcyjnej na końcu tomu."},{"tag":"p","text":"Okładka i jedenaście plansz w tekście: rysunki ołówkiem wygenerowane komputerowo (model GPT Image 2). Podpisy plansz odsyłają do rozdziałów i wersetów, które ilustrują."},{"tag":"h3","text":"Licencja"},{"tag":"p","text":"Starożytny tekst źródłowy jest w domenie publicznej."},{"tag":"p","text":"Ten przekład, przypisy i ilustracje udostępniamy na licencji Creative Commons Uznanie autorstwa - Na tych samych warunkach 4.0 Międzynarodowe (CC BY-SA 4.0)."},{"tag":"p","text":"Możesz je kopiować, drukować, rozpowszechniać i przerabiać, także komercyjnie, pod dwoma warunkami: podaj źródło („Księga Henocha, https://chrzescijanie-rzeszow.pl/ksiega-henocha, CC BY-SA 4.0”) i udostępnij swoje przeróbki na tej samej licencji."},{"tag":"p","text":"Pliki źródłowe (markdown, skład Typst, skrypty budujące) są dostępne razem z wydaniem. Wszystko zbudowane wyłącznie otwartymi narzędziami: Typst, pandoc, Calibre, Pillow, EB Garamond (OFL)."}],"nota":[{"tag":"h2","text":"Nota o tekstach oryginalnych"},{"tag":"p","text":"Przekład, który masz przed sobą, opiera się na tym, co o oryginalnym tekście księgi wiadomo dziś z trzech niezależnych tradycji rękopiśmiennych:"},{"tag":"p","text":"Tekst etiopski (ge’ez). Jedyny pełny świadek księgi. Jest to przekład z greki, dokonany prawdopodobnie między IV a VI wiekiem po Chr., zachowany w kilkudziesięciu rękopisach (najstarsze z XV wieku). Dzieli się na dwie rodziny: starszą (Eth I) i młodszą, „wygładzoną” (Eth II). Wszystkie pełne wydania i przekłady księgi - także ten - mają za podstawę tę tradycję."},{"tag":"p","text":"Fragmenty greckie. Zachowały się cztery ważne świadectwa: kodeks z Akhmim w Egipcie (tzw. Kodeks Panopolitański, znaleziony w grobie mnicha w 1886/87 r., zawiera rozdziały 1-32), obszerne cytaty u bizantyjskiego kronikarza Jerzego Synkellosa (fragmenty rozdziałów 6-16), papirus Chester Beatty-Michigan z IV w. (rozdziały 97-107) oraz drobny fragment watykański (89,42-49). Greka jest ogniwem pośrednim między oryginałem a wersją etiopską - tam, gdzie się zachowała, pozwala korygować błędy etiopskich kopistów."},{"tag":"p","text":"Fragmenty aramejskie z Qumran. Największe odkrycie dla badań nad księgą: w grocie 4 nad Morzem Martwym znaleziono szczątki jedenastu zwojów (4Q201-4Q212, opublikowane w 1976 r.), spisanych między III w. przed Chr. a I w. po Chr. Potwierdzają one, że oryginalnym językiem księgi był aramejski (być może z hebrajskimi partiami), i obejmują wszystkie jej części z wyjątkiem Księgi Przypowieści. Fragmenty astronomiczne (4Q208-211) przekazują tekst dłuższy i bardziej techniczny niż wersja etiopska - widać, że etiopski tłumacz miał przed sobą już skróconą postać tej księgi. Zwój 4Q212 potwierdza też pierwotną kolejność tekstu w Apokalipsie tygodni, przestawioną w rękopisach etiopskich (zob. przypisy do rozdziałów 91 i 93)."},{"tag":"p","text":"Fragment łaciński (rozdział 106) oraz cytaty u pisarzy wczesnochrześcijańskich uzupełniają obraz przekazu."},{"tag":"p","text":"Ponieważ żaden pojedynczy rękopis nie oddaje oryginału wiernie, każdy nowoczesny przekład jest pracą krytyczną: podstawą jest tekst etiopski, poprawiany według greki i aramejskiego tam, gdzie te istnieją. Tak postępowały klasyczne przekłady naukowe - R.H. Charlesa (1912/1917), M.A. Knibba (1978), a ostatnio G.W.E. Nickelsburga i J.C. VanderKama (2001-2012) - i tak postępuje również ten przekład. Miejsca, w których tradycje tekstu się rozchodzą albo tekst jest uszkodzony, zaznaczono w przypisach."}],"jak-czytac":[{"tag":"h2","text":"Jak czytać ten przekład"},{"tag":"p","text":"Celem tego przekładu jest wierność połączona ze zrozumiałością: tekst ma być czytelny dla współczesnego czytelnika bez sięgania po komentarze, a zarazem nie ma niczego dopowiadać po cichu. Dlatego:"}]}}</script>
