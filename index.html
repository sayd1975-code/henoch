  {name:"List Henocha", from:91, to:108, desc:"Apokalipsa Tygodni, napomnienia i losy sprawiedliwych oraz grzeszników."}
];
var byNum = {}; CH.forEach(function(c){ byNum[c.num] = c; });
function partOf(n){ for (var i=0;i<PARTS.length;i++) if (n>=PARTS[i].from && n<=PARTS[i].to) return PARTS[i]; return null; }

/* ================= STAN ================= */
var LSP = "henoch-v1-prefs", LSB = "henoch-v1-bm", LSL = "henoch-v1-last";
var prefs = {theme:"auto", fs:18};
try { var p = JSON.parse(localStorage.getItem(LSP)); if (p && typeof p==="object") prefs = Object.assign(prefs, p); } catch(e){}
var bms = [];
try { var b = JSON.parse(localStorage.getItem(LSB)); if (Array.isArray(b)) bms = b; } catch(e){}
var last = null;
try { var l = JSON.parse(localStorage.getItem(LSL)); if (l && l.ch) last = l; } catch(e){}
function savePrefs(){ try { localStorage.setItem(LSP, JSON.stringify(prefs)); } catch(e){} }
function saveBms(){ try { localStorage.setItem(LSB, JSON.stringify(bms)); } catch(e){} }
function saveLast(){ try { localStorage.setItem(LSL, JSON.stringify(last)); } catch(e){} }

var view = "home";        // home | read | about
var curCh = null;         // numer rozdziału
var selVerse = null;      // klucz wybranego wersetu "ch:v"
var sheetCtx = null;      // werset dla notatki
var searchOpen = false;

/* ================= MOTYW / CZCIONKA ================= */
function applyTheme(){
  var dark = prefs.theme==="dark" || (prefs.theme!=="light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  document.getElementById("bTheme").textContent = dark ? "🌙" : "☀️";
  var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute("content", dark ? "#020617" : "#f8fafc");
}
function applyFont(){
  prefs.fs = Math.min(26, Math.max(14, prefs.fs));
  document.documentElement.style.setProperty("--vfs", prefs.fs + "px");
}
document.getElementById("bTheme").onclick = function(){ prefs.theme = prefs.theme==="dark" ? "light" : (prefs.theme==="light" ? "auto" : "dark"); savePrefs(); applyTheme(); flashTheme(); };
function flashTheme(){
  var t = prefs.theme==="auto" ? "🖥️ motyw systemowy" : (prefs.theme==="dark" ? "🌙 ciemny" : "☀️ jasny");
  var d = document.createElement("div");
  d.textContent = t; d.style.cssText = "position:fixed;z-index:99;left:50%;top:70px;transform:translateX(-50%);background:#0f172a;color:#fbbf24;padding:8px 16px;border-radius:10px;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.4)";
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1200);
}
document.getElementById("bFontPlus").onclick = function(){ prefs.fs += 1; savePrefs(); applyFont(); };
document.getElementById("bFontMinus").onclick = function(){ prefs.fs -= 1; savePrefs(); applyFont(); };

/* ================= NAWIGACJA ================= */
function go(v, ch){ view = v; if (ch != null){ curCh = ch; last = {ch:ch, ts:Date.now()}; saveLast(); } selVerse = null; render(); window.scrollTo(0,0); }
document.getElementById("bHome").onclick = function(){ go("home"); };
document.getElementById("bBm").onclick = function(){ renderBm(); document.getElementById("bmdrawer").classList.add("open"); };
document.getElementById("bmClose").onclick = function(){ document.getElementById("bmdrawer").classList.remove("open"); };
document.getElementById("bSearch").onclick = function(){
  searchOpen = !searchOpen;
  document.getElementById("searchbar").classList.toggle("open", searchOpen);
  if (searchOpen) document.getElementById("sinput").focus(); else { document.getElementById("sresults").classList.remove("open"); }
};

/* ================= SZUKAJ ================= */
var sTimer = null;
document.getElementById("sinput").addEventListener("input", function(){
  var q = this.value.trim().toLowerCase();
  clearTimeout(sTimer);
  if (q.length < 3){ document.getElementById("sresults").classList.remove("open"); return; }
  sTimer = setTimeout(function(){ doSearch(q); }, 160);
});
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function doSearch(q){
  var out = [], total = 0;
  var days = Date.now();
  for (var i=0;i<CH.length && total<60;i++){
    var c = CH[i];
    for (var j=0;j<c.blocks.length;j++){
      var b = c.blocks[j];
      if (b.t!=="v" && b.t!=="p") continue;
      var low = (b.text||"").toLowerCase();
      var idx = low.indexOf(q);
      if (idx < 0) continue;
      total++;
      if (out.length >= 40) continue;
      var s0 = Math.max(0, idx-38), s1 = Math.min(b.text.length, idx + q.length + 70);
      var snip = (s0>0?"…":"") + b.text.slice(s0, s1).replace(/\[\[\d+\]\]/g,"") + (s1<b.text.length?"…":"");
      var rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
      out.push('<button class="sres" data-ch="'+c.num+'" data-v="'+esc(b.v||"")+'">' +
        '<span class="ref">' + c.num + (b.v ? ":" + esc(b.v) : "") + '</span>' + esc(snip).replace(rx,"<mark>$1</mark>") + '</button>');
    }
  }
  var box = document.getElementById("sresults");
  if (!out.length){ box.innerHTML = '<div class="sres muted">Brak wyników dla „'+esc(q)+'”.</div>'; }
  else box.innerHTML = out.join("") + (total>40 ? '<div class="sres muted">…i '+(total-40)+' dalszych</div>' : "");
  box.classList.add("open");
  Array.prototype.forEach.call(box.querySelectorAll(".sres[data-ch]"), function(el){
    el.onclick = function(){
      document.getElementById("sresults").classList.remove("open");
      document.getElementById("sinput").value = "";
      go("read", parseInt(el.getAttribute("data-ch"),10));
      var v = el.getAttribute("data-v");
      if (v){ setTimeout(function(){ jumpTo(v); }, 60); }
    };
  });
}

/* ================= ZAKŁADKI / NOTATKI ================= */
function bmKey(ch, v){ return ch + ":" + v; }
function getBm(ch, v){ for (var i=0;i<bms.length;i++) if (bms[i].k===bmKey(ch,v)) return bms[i]; return null; }
function toggleBm(ch, v, text){
  var k = bmKey(ch, v), ex = getBm(ch, v);
  if (ex){ bms.splice(bms.indexOf(ex),1); } else { bms.unshift({k:k, ch:ch, v:v, snip:(text||"").slice(0,120), note:"", ts:Date.now()}); }
  saveBms(); render();
}
function renderBm(){
  var el = document.getElementById("bmlist");
  if (!bms.length){ el.innerHTML = '<div class="empty">Brak zakładek.<br><span class="muted">Dotknij werset podczas czytania, potem 🔖.</span></div>'; return; }
  el.innerHTML = bms.map(function(b, i){
    return '<div class="bmitem" data-i="'+i+'"><button class="del" data-del="'+i+'">🗑️</button>' +
      '<div class="ref">Rozdział ' + b.ch + (b.v ? ", wers " + esc(b.v) : "") + '</div>' +
      '<div class="snip">' + esc(b.snip) + "…" + '</div>' +
      (b.note ? '<div class="bnote">' + esc(b.note) + '</div>' : "") + '</div>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".bmitem"), function(it){
    it.onclick = function(e){
      if (e.target.getAttribute("data-del") !== null && e.target.hasAttribute("data-del")){ e.stopPropagation(); return; }
      var b = bms[parseInt(it.getAttribute("data-i"),10)];
      document.getElementById("bmdrawer").classList.remove("open");
      go("read", b.ch); setTimeout(function(){ jumpTo(b.v); }, 60);
    };
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-del]"), function(btn){
    btn.onclick = function(e){ e.stopPropagation(); bms.splice(parseInt(btn.getAttribute("data-del"),10),1); saveBms(); renderBm(); render(); };
  });
}

/* ================= ARKUSZ NOTATKI ================= */
function openSheet(ch, v){
  sheetCtx = {ch:ch, v:v};
  var b = getBm(ch, v);
  document.getElementById("sheetTitle").textContent = "✏️ Notatka — R" + ch + (v ? ":" + v : "");
  document.getElementById("sheetTxt").value = b && b.note ? b.note : "";
  document.getElementById("notesheet").classList.add("open");
}
document.getElementById("sheetCancel").onclick = function(){ document.getElementById("notesheet").classList.remove("open"); };
document.getElementById("sheetSave").onclick = function(){
  var txt = document.getElementById("sheetTxt").value.trim();
  var b = getBm(sheetCtx.ch, sheetCtx.v);
  if (txt){
    if (!b){ bms.unshift({k:bmKey(sheetCtx.ch, sheetCtx.v), ch:sheetCtx.ch, v:sheetCtx.v, snip:"", note:txt, ts:Date.now()}); }
    else b.note = txt;
  } else if (b) b.note = "";
  saveBms();
  document.getElementById("notesheet").classList.remove("open");
  render();
};
function copyVerse(text){
  var t = text.replace(/\[\[\d+\]\]/g, "");
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); }
  else { var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); }
}

/* ================= RENDER ================= */
var app = document.getElementById("app");
function render(){
  if (view==="read" && curCh!=null) renderRead();
  else if (view==="about") renderAbout();
  else renderHome();
}

/* ---------- HOME ---------- */
function renderHome(){
  var h = [];
  h.push('<div class="card hero"><div class="t">📖 Księga Henocha</div>' +
    '<div class="s">1 Henoch · księga etiopska · 108 rozdziałów · pełny polski przekład z etiopskiego (ge’ez)</div></div>');
  if (last && byNum[last.ch]){
    h.push('<div class="card partcard" id="resume"><div class="pname">↩ Czytaj dalej</div>' +
      '<div class="pdesc">Rozdział ' + last.ch + ' — ' + esc(byNum[last.ch].part||partOf(last.ch).name) + '</div></div>');
  }
  h.push('<div class="card partcard" id="randcard"><div class="pname">🎲 Losowy werset</div>' +
    '<div class="pdesc" id="randvers">…</div></div>');
  h.push('<div class="card"><h2 class="sec">📚 Pięć ksiąg</h2>');
  PARTS.forEach(function(p){
    h.push('<div style="margin-bottom:16px" data-part="'+p.from+'">' +
      '<div class="pname" style="color:var(--amber);font-weight:800">' + p.name +
      ' <span class="muted" style="font-weight:400">· rozdz. ' + p.from + '–' + p.to + '</span></div>' +
      '<div class="pdesc">' + p.desc + '</div><div class="chips" id="chips-' + p.from + '"></div></div>');
  });
  h.push('<button class="linkbtn" id="aboutLink">ℹ️ O księdze i o tym przekładzie</button></div>');
  app.innerHTML = h.join("");

  // chipy rozdziałów
  PARTS.forEach(function(p){
    var box = document.getElementById("chips-" + p.from);
    var cs = [];
    for (var n=p.from; n<=p.to; n++) cs.push('<button class="chip" data-ch="'+n+'">'+n+'</button>');
    box.innerHTML = cs.join("");
    Array.prototype.forEach.call(box.querySelectorAll(".chip"), function(ch){
      ch.onclick = function(){ go("read", parseInt(ch.getAttribute("data-ch"),10)); };
    });
  });
  document.getElementById("resume").onclick = function(){ go("read", last.ch); };
  document.getElementById("aboutLink").onclick = function(){ go("about"); };
  // losowy werset: karta losuje, tekst wersetu skacze
  var rv = document.getElementById("randvers");
  function randomize(){
    var c = CH[Math.floor(Math.random()*CH.length)];
    var vs = c.blocks.filter(function(b){return b.t==="v";});
    if (!vs.length) return;
    var v = vs[Math.floor(Math.random()*vs.length)];
    rv.innerHTML = '<b style="color:var(--amber)">R'+c.num+':'+esc(v.v)+'</b> — ' +
      esc(v.text.slice(0,150).replace(/\[\[\d+\]\]/g,"")) + '…';
    rv.dataset.ch = c.num; rv.dataset.v = v.v;
  }
  document.getElementById("randcard").onclick = randomize;
  rv.onclick = function(e){
    e.stopPropagation();
    if (rv.dataset.ch){ go("read", parseInt(rv.dataset.ch,10)); setTimeout(function(){ jumpTo(rv.dataset.v); }, 60); }
  };
  randomize();
}

/* ---------- ABOUT ---------- */
function renderAbout(){
  var h = [];
  h.push('<div class="crumbs">ℹ️ O księdze</div><div class="chtitle">O księdze i przekładzie</div>');
  ["o-ksiedze","jak-czytac","nota","wydanie"].forEach(function(k){
    var sec = FM[k]; if (!sec) return;
    sec.forEach(function(p){
      if (p.tag==="h2"||p.tag==="h3") h.push('<div class="hblock">'+esc(p.text)+'</div>');
      else h.push('<div style="margin-bottom:14px">'+esc(p.text)+'</div>');
    });
    h.push('<div style="border-top:1px solid var(--line);margin:18px 0"></div>');
  });
  h.push('<div class="noteblk">Apka: tekst osadzony offline, zakładki i notatki wyłącznie w pamięci lokalnej przeglądarki (localStorage). ' +
    'Przekład i przypisy: <a href="https://chrzescijanie-rzeszow.pl/ksiega-henocha" target="_blank" rel="noopener">chrzescijanie-rzeszow.pl/ksiega-henocha</a>, licencja CC BY-SA 4.0 (uznanie autorstwa + ta sama licencja dla zmian).</div>');
  h.push('<div class="navbtns"><button class="nbtn" id="backHome">← Spis treści</button></div>');
  app.innerHTML = h.join("");
  document.getElementById("backHome").onclick = function(){ go("home"); };
}

/* ---------- READ ---------- */
function blockHtml(b, chNum){
  if (b.t==="h") return '<div class="hblock">'+esc(b.text)+'</div>';
  if (b.t==="note") return '<div class="noteblk">ℹ️ '+esc(b.text)+'</div>';
  if (b.t==="quote") return '<div class="qblock">'+versHtml(b.text,chNum,"")+'</div>';
  if (b.t==="list"){
    var tag = b.ordered ? "ol" : "ul";
    return '<div class="listblk"><'+tag+'>' + b.items.map(function(it){ return "<li>"+versHtml(it,chNum,"")+"</li>"; }).join("") + '</'+tag+'></div>';
  }
  if (b.t==="v"){
    var bmed = getBm(chNum, b.v) ? " bmed" : "";
    return '<div class="verse'+bmed+'" data-v="'+esc(b.v)+'" id="v-'+chNum+'-'+esc(b.v)+'">' +
      '<span class="vnum'+(String(b.v).indexOf(":")>=0?" big":"")+'">'+esc(b.v)+'</span>' +
      versHtml(b.text, chNum, b.v) + '</div>';
  }
  // p
  return '<div class="verse" data-v="">'+versHtml(b.text, chNum, "")+'</div>';
}
function versHtml(text, chNum, v){
  // zamień [[n]] na sup.fn + dodaj fnboxy
  var parts = text.split(/(\[\[\d+\]\])/);
  var out = [], boxes = [];
  for (var i=0;i<parts.length;i++){
    var m = parts[i].match(/^\[\[(\d+)\]\]$/);
    if (m){
      var n = m[1];
      out.push('<sup class="fn" data-n="'+n+'"></sup>');
      boxes.push('<div class="fnbox" data-for="'+n+'"><b style="color:var(--amber)">'+n+'</b> '+
        esc((byNum[chNum].notes||{})[n]||"")+'</div>');
    } else if (parts[i]) out.push(esc(parts[i]));
  }
  var res = out.join("");
  if (boxes.length) res += '<div class="fnwrap" style="margin:-8px 0 0 10px">' + boxes.join("") + '</div>';
  return res;
}
function renderRead(){
  var c = byNum[curCh]; if (!c){ view="home"; renderHome(); return; }
  var p = partOf(c.num);
  var h = [];
  h.push('<div class="crumbs">'+ esc(p ? p.name : "") + (c.part && c.part!==p.name ? ' · ' + esc(c.part) : '') +'</div>');
  h.push('<div class="chtitle">Rozdział '+c.num+'</div>');
  c.blocks.forEach(function(b){ h.push(blockHtml(b, c.num)); });
  h.push('<div class="navbtns">' +
    (c.num>1 ? '<button class="nbtn" id="prevCh">← Rozdział '+(c.num-1)+'</button>' : '<button class="nbtn" disabled>←</button>') +
    '<button class="nbtn" id="tocBtn">☰ Spis</button>' +
    (c.num<108 ? '<button class="nbtn" id="nextCh">Rozdział '+(c.num+1)+' →</button>' : '<button class="nbtn" disabled>→</button>') +
    '</div>');
  app.innerHTML = h.join("");
  if (c.num>1) document.getElementById("prevCh").onclick = function(){ go("read", c.num-1); };
  if (c.num<108) document.getElementById("nextCh").onclick = function(){ go("read", c.num+1); };
  document.getElementById("tocBtn").onclick = function(){ go("home"); };

  // przypisy — toggle
  Array.prototype.forEach.call(app.querySelectorAll("sup.fn"), function(sup){
    sup.onclick = function(e){
      e.stopPropagation();
      var box = app.querySelector('.fnbox[data-for="'+sup.getAttribute("data-n")+'"]');
      if (box) box.classList.toggle("open");
    };
  });
  // wybór wersetu + akcje
  Array.prototype.forEach.call(app.querySelectorAll(".verse"), function(vs){
    vs.onclick = function(){
      var v = vs.getAttribute("data-v");
      if (selVerse === curCh+":"+v){ selVerse = null; render(); return; }
      selVerse = v ? curCh+":"+v : null;
      if (!v) return; // blok bez numeru — bez akcji
      render();
    };
  });
  if (selVerse){
    var v0 = selVerse.split(":").slice(1).join(":");
    var el = app.querySelector('.verse[data-v="'+CSS.escape(v0)+'"]');
    if (el){
      el.classList.add("sel");
      var bmed = !!getBm(curCh, v0);
      var bar = document.createElement("div");
      bar.className = "vactions";
      bar.innerHTML =
        '<button class="vabtn'+(bmed?" on":"")+'" id="aBm">'+(bmed?"🔖 W zakładkach":"🔖 Do zakładek")+'</button>' +
        '<button class="vabtn" id="aNote">✏️ Notatka</button>' +
        '<button class="vabtn" id="aCopy">📋 Kopiuj</button>';
      el.after(bar);
      var bl = c.blocks.filter(function(b){ return b.t==="v" && String(b.v)===v0; })[0];
      document.getElementById("aBm").onclick = function(e){ e.stopPropagation(); toggleBm(curCh, v0, bl?bl.text:""); };
      document.getElementById("aNote").onclick = function(e){ e.stopPropagation(); openSheet(curCh, v0); };
      document.getElementById("aCopy").onclick = function(e){ e.stopPropagation(); copyVerse(bl?bl.text:""); bar.querySelector("#aCopy").textContent="✅ Skopiowano"; setTimeout(function(){ render(); }, 900); };
    }
  }
}
function jumpTo(v){
  if (v==null || v==="") return;
  var el = app.querySelector('.verse[data-v="'+CSS.escape(String(v))+'"]');
  if (el){ el.classList.add("jumpmark"); el.scrollIntoView({behavior:"smooth", block:"center"}); }
}

/* ================= BOOT ================= */
applyTheme(); applyFont(); render();
// odśwież motyw gdy system zmieni (tryb auto)
if (window.matchMedia) try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ if (prefs.theme==="auto") applyTheme(); }); }catch(e){}
// rejestracja service workera (offline PWA; w podglądzie canvas nieszkodliwa)
try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){}); } catch(e){}
</script>
</body>
</html>
